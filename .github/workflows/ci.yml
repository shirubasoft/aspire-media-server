name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install Aspire CLI
        working-directory: .
        run: |
          curl -sSL https://aspire.dev/install.sh | bash
          echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Build and lint
        run: npm run build

      - name: Validate immutable container images
        run: npm run images:check

      - name: Run unit tests
        run: npm run test:unit

      - name: Validate deployment plan with a host-non-writable bind mount
        shell: bash
        run: |
          test_root="$(mktemp -d)"
          cleanup() {
            chmod u+w "$test_root/downloads"
            rmdir "$test_root/data" "$test_root/media" "$test_root/downloads"
            rmdir "$test_root"
          }
          trap cleanup EXIT
          mkdir "$test_root/data" "$test_root/media" "$test_root/downloads"
          chmod a-w "$test_root/downloads"
          ARRSPIRE_DATA_PATH="$test_root/data" \
          ARRSPIRE_MEDIA_PATH="$test_root/media" \
          ARRSPIRE_DOWNLOADS_PATH="$test_root/downloads" \
            aspire deploy --list-steps --non-interactive

      - name: Validate Compose publication
        run: npm run publish && npm run publication:check

  e2e:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: src
    env:
      ARRSPIRE_CONTAINER_ENGINE: docker
      ASPIRE_CONTAINER_RUNTIME: docker
      Parameters__vpn_wireguard_key: ${{ secrets.VPN_WIREGUARD_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install Aspire CLI
        working-directory: .
        run: |
          curl -sSL https://aspire.dev/install.sh | bash
          echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"

      - name: Enable TUN device
        working-directory: .
        run: |
          sudo modprobe tun || true
          if [[ ! -c /dev/net/tun ]]; then
            sudo mkdir -p /dev/net
            sudo mknod /dev/net/tun c 10 200
          fi
          sudo chmod 666 /dev/net/tun
          test -c /dev/net/tun

      - name: Verify Docker
        working-directory: .
        run: docker info

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run isolated real-stack E2E
        run: npm test
